# Holt jeden Montag automatisch die neue Liste der Bundesnetzagentur
# und speichert daten/standorte.json, falls sich etwas geändert hat.
name: Daten aktualisieren

on:
  schedule:
    - cron: "0 5 * * 1"   # montags um 5 Uhr (UTC)
  workflow_dispatch:       # erlaubt den Start per Knopf "Run workflow"

permissions:
  contents: write          # nötig, damit der Ablauf die Datei speichern darf

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ladesäulen laden und filtern
        run: python3 aktualisieren.py

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten/standorte.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Ladesäulen-Daten aktualisiert"
            git push
          fi
