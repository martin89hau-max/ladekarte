name: Datenbank laden
# Von Hand starten: Actions, "Datenbank laden", "Run workflow".
# Braucht das Secret DATABASE_URL (Verbindungsadresse der Neon-Datenbank).
on:
  workflow_dispatch:
jobs:
  laden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]"
      - run: python3 db/laden.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
